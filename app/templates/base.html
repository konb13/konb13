<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Article Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block head %}{% endblock %}
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
<div class="sidebar">
  <div class="sidebar-brand">
    <i class="bi bi-pencil-square me-2"></i>ArticleBot
  </div>
  <nav class="sidebar-nav">
    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
      <i class="bi bi-grid-3x3-gap"></i> Dashboard
    </a>
    <a href="/schedules" class="nav-link {% if '/schedules' in request.url.path %}active{% endif %}">
      <i class="bi bi-calendar-week"></i> Schedules
    </a>
    <hr class="sidebar-divider" />
    <button class="nav-link w-100 text-start" data-bs-toggle="modal" data-bs-target="#generateModal">
      <i class="bi bi-plus-circle"></i> Generate Article
    </button>
  </nav>
</div>

<!-- ── Main content ─────────────────────────────────────────────────────── -->
<div class="main-content">
  {% block content %}{% endblock %}
</div>

<!-- ── Generate Article Modal ───────────────────────────────────────────── -->
<div class="modal fade" id="generateModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Generate New Article</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label text-muted small">Topic / Title</label>
          <input type="text" id="genTopic" class="form-control bg-secondary text-white border-0"
                 placeholder="e.g. best AI tools for small business" />
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label text-muted small">Tone</label>
            <select id="genTone" class="form-select bg-secondary text-white border-0">
              <option value="professional">Professional</option>
              <option value="casual">Casual</option>
              <option value="educational">Educational</option>
              <option value="conversational">Conversational</option>
              <option value="authoritative">Authoritative</option>
              <option value="witty">Witty</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label text-muted small">Image Provider</label>
            <select id="genImageProvider" class="form-select bg-secondary text-white border-0">
              <option value="dalle">DALL-E 3</option>
              <option value="gemini">Gemini Imagen</option>
            </select>
          </div>
        </div>
        <div class="row g-2 mt-1">
          <div class="col-4">
            <label class="form-label text-muted small">Country</label>
            <input type="text" id="genCountry" class="form-control bg-secondary text-white border-0" value="US" maxlength="3" />
          </div>
          <div class="col-4">
            <label class="form-label text-muted small">Language</label>
            <input type="text" id="genLang" class="form-control bg-secondary text-white border-0" value="en" maxlength="5" />
          </div>
          <div class="col-4">
            <label class="form-label text-muted small">Category</label>
            <input type="text" id="genCategory" class="form-control bg-secondary text-white border-0" placeholder="optional" />
          </div>
        </div>
        <div id="genStatus" class="mt-3 d-none">
          <div class="d-flex align-items-center gap-2 text-info">
            <div class="spinner-border spinner-border-sm"></div>
            <span id="genStatusMsg">Generating… this takes ~60 seconds</span>
          </div>
        </div>
      </div>
      <div class="modal-footer border-secondary">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="genSubmitBtn" onclick="startGeneration()">
          <i class="bi bi-lightning-charge"></i> Generate
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
